    <!-- Meta Pixel Code. The fbq queue is created immediately so events fired
         during page load (ViewContent on a product landing, Purchase on the
         return from payment) are queued instead of dropped. fbevents.js itself
         is only downloaded once marketing cookies are allowed (see
         src/lib/cookieConsent.ts), and then not before first interaction or
         shortly after load, to reduce render impact. -->
    <script>
      (function () {
        var loaded = false;
        var wanted = false;
        var interactionEvents = [
          "pointerdown",
          "keydown",
          "scroll",
          "touchstart",
        ];

        // A choice the visitor already made. Without one the flag stays unset
        // until the consent banner code applies their choice or the default
        // for their region.
        try {
          var stored = JSON.parse(
            window.localStorage.getItem("mv_cookie_consent") || "null"
          );
          if (stored && typeof stored.marketing === "boolean") {
            window.__mvMarketingConsent = stored.marketing;
          }
        } catch (e) {}

        if (!window.fbq) {
          var n = (window.fbq = function () {
            n.callMethod
              ? n.callMethod.apply(n, arguments)
              : n.queue.push(arguments);
          });
          if (!window._fbq) window._fbq = n;
          n.push = n;
          n.loaded = !0;
          n.version = "2.0";
          n.queue = [];
        }

        fbq("init", "2056673991610593");
        fbq("track", "PageView");

        function loadPixel() {
          // Remembered so that consent given later starts the download at once.
          wanted = true;
          if (loaded || window.__mvMarketingConsent !== true) return;
          loaded = true;

          var t = document.createElement("script");
          t.async = !0;
          t.src = "https://connect.facebook.net/en_US/fbevents.js";
          var s = document.getElementsByTagName("script")[0];
          s.parentNode.insertBefore(t, s);

          interactionEvents.forEach(function (name) {
            window.removeEventListener(name, loadPixel);
          });
        }

        // Called by conversion events that must not be lost (Purchase).
        window.__loadMetaPixel = loadPixel;
        // Called when marketing cookies become allowed: starts the download
        // only if a visitor interaction or the timer has already asked for it.
        window.__resumeMetaPixel = function () {
          if (wanted) loadPixel();
        };

        interactionEvents.forEach(function (name) {
          window.addEventListener(name, loadPixel, { passive: true });
        });

        function loadSoon() {
          setTimeout(loadPixel, 3000);
        }
        if (document.readyState === "complete") {
          loadSoon();
        } else {
          window.addEventListener("load", loadSoon, { once: true });
        }
      })();
    </script>
    <!-- End Meta Pixel Code -->
  </head>

  <body>
    <div id="root"></div>

  </body>
